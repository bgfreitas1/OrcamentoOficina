services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: orcamentooficina-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SuaSenhaForte!123"

    ports:
      - "14330:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SuaSenhaForte!123' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: orcamentooficina-api

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Server=tcp:sqlserver,1433;Database=OrcamentoOficina;User Id=sa;Password=SuaSenhaForte!123;Encrypt=False;TrustServerCertificate=True"

    ports:
      - "8080:8080"

    depends_on:
      sqlserver:
        condition: service_healthy


volumes:
  sqlserver_data: